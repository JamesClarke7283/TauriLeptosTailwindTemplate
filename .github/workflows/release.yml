name: 'release'

# Builds the Tauri app for:
#   - Linux   x86_64  (native ubuntu-22.04)
#   - Linux   aarch64 (native ubuntu-22.04-arm, public-repo runner)
#   - Windows x86_64  (native windows-latest)
#   - Windows aarch64 (cross-compiled from windows-latest)
#   - macOS   x86_64  (cross-compiled from macos-latest / Apple silicon)
#   - macOS   aarch64 (Apple Silicon, native macos-latest)
#   - Android aarch64 (unsigned APK and AAB, native ubuntu-22.04)
#   - iOS     aarch64 (unsigned IPA, native macos-latest)
#
# Pushing a tag like `v1.2.3` builds every target, attaches the packages to a
# draft GitHub Release, then publishes it after all builds and uploads succeed.
# A manual run (workflow_dispatch) from a branch only uploads workflow artifacts.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required so tauri-action can create the GitHub Release on tag pushes.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            args: ''
            rust_targets: wasm32-unknown-unknown

          - name: Linux aarch64
            platform: ubuntu-22.04-arm
            args: ''
            rust_targets: wasm32-unknown-unknown

          - name: Windows x86_64
            platform: windows-latest
            # WiX/MSI: avoids the unsigned nsis_tauri_utils.dll that current
            # Windows Defender quarantines on CI (tauri-apps/tauri#14882).
            args: '--bundles msi'
            rust_targets: wasm32-unknown-unknown

          - name: Windows aarch64
            platform: windows-latest
            # Cross-compiled from the x64 runner; WiX produces the arm64 MSI.
            args: '--target aarch64-pc-windows-msvc --bundles msi'
            rust_targets: wasm32-unknown-unknown,aarch64-pc-windows-msvc

          - name: macOS x86_64
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: wasm32-unknown-unknown,x86_64-apple-darwin

          - name: macOS aarch64
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: wasm32-unknown-unknown,aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri v2 system dependencies (webkit2gtk 4.1, appindicator, etc.).
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # The Trunk pre_build hook (Tailwind v4) and the tauri-sys crate need
      # these on the global npm root; the hook resolves them via NODE_PATH.
      - name: Install global npm tools (Tailwind + esbuild)
        run: npm install --global tailwindcss @tailwindcss/cli esbuild

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace target dir lives at the repo root.
          workspaces: '. -> target'
          key: ${{ matrix.name }}

      # Trunk bundles the Leptos WASM frontend (runs as Tauri's beforeBuildCommand).
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The mobile matrix builds its own packages on the required hosts.
          TAURI_BUILD_MOBILE: 'false'
        with:
          # On a tag push -> create a draft release; otherwise just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Always expose the installers as workflow artifacts (handy for manual runs).
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/**
            target/release/bundle/**

  build-mobile:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android aarch64 (unsigned)
            platform: ubuntu-22.04
            mobile: android
            rust_targets: wasm32-unknown-unknown,aarch64-linux-android
            artifact: android-aarch64-unsigned
            artifacts: |
              src-tauri/gen/android/app/build/outputs/apk/**/*.apk
              src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

          - name: iOS aarch64 (unsigned)
            platform: macos-latest
            mobile: ios
            rust_targets: wasm32-unknown-unknown,aarch64-apple-ios
            artifact: ios-aarch64-unsigned
            artifacts: src-tauri/gen/apple/build/arm64/*.ipa

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # The locked CLI supports `ios build --no-sign`, so compilation needs
      # no Apple certificates, provisioning profiles, or development team.
      - name: Install npm dependencies
        run: npm ci

      - name: Install global npm tools (Tailwind + esbuild)
        run: npm install --global tailwindcss @tailwindcss/cli esbuild

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.artifact }}

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Match the SDK used by the pinned Tauri CLI's generated Gradle project.
      - name: Install Android SDK and NDK
        if: matrix.mobile == 'android'
        env:
          NDK_VERSION: '28.2.13676358'
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install iOS tools
        if: matrix.mobile == 'ios'
        run: brew install xcodegen cocoapods libimobiledevice

      # Generated native projects are ignored in this template. Initialize
      # them on each runner after installing that platform's toolchain.
      - name: Initialize mobile project
        run: npm run tauri -- ${{ matrix.mobile }} init --ci --skip-targets-install

      - name: Build Android APK and AAB
        if: matrix.mobile == 'android'
        run: npm run build:android -- --ci --target aarch64 --apk --aab

      - name: Build unsigned iOS IPA
        if: matrix.mobile == 'ios'
        run: npm run build:ios -- --ci --target aarch64 --no-sign

      - name: Upload mobile bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.artifacts }}

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    # Desktop tauri-action uploads to a shared draft. Publish only after every
    # desktop/mobile build succeeds and all mobile assets have been attached.
    needs: [build, build-mobile]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download mobile bundles
        uses: actions/download-artifact@v4
        with:
          pattern: '*-unsigned'
          path: mobile-artifacts

      - name: Upload mobile release assets
        run: |
          assets=()
          for extension in apk aab ipa; do
            mapfile -d '' packages < <(find mobile-artifacts -type f -name "*.$extension" -print0)
            if (( ${#packages[@]} == 0 )); then
              echo "::error::Missing mobile release asset: .$extension"
              exit 1
            fi
            assets+=("${packages[@]}")
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Publish completed release
        run: gh release edit "$RELEASE_TAG" --draft=false
